[mypy]
python_version = 3.13
warn_unused_configs = true
show_error_codes = true
namespace_packages = true
# Practical settings for existing large codebase
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
warn_return_any = false
check_untyped_defs = false
warn_no_return = true
warn_unreachable = false
allow_redefinition = true
follow_imports = silent

# Ignore BeautifulSoup-heavy modules until we add proper type guards
[mypy-src.processors.html_processor]
ignore_errors = True

[mypy-src.processors.metadata_extractor]
ignore_errors = True

[mypy-src.processors.content_extractors]
ignore_errors = True

[mypy-src.rendering.detector]
ignore_errors = True

[mypy-src.plugins.examples.seo_metadata_plugin]
ignore_errors = True

[mypy-src.plugins.examples.font_cleanup_plugin]
ignore_errors = True

[mypy-src.auth.oauth_extension_example]
ignore_errors = True

[mypy-src.database.examples.transaction_patterns]
ignore_errors = True

# Ignore complex caching modules that need significant refactoring  
[mypy-src.caching.*]
ignore_errors = True

[mypy-src.batch.processor]
ignore_errors = True

[mypy-src.utils.robots]
ignore_errors = True

[mypy-src.utils.retry]
ignore_errors = True

[mypy-src.plugins.base]
ignore_errors = True

[mypy-src.plugins.registry]
ignore_errors = True

[mypy-src.plugins.manager]
ignore_errors = True

[mypy-src.processors.image_downloader]
ignore_errors = True

[mypy-src.core.config]
ignore_errors = True

# Third-party library ignores
[mypy-alembic.*]
ignore_missing_imports = True

[mypy-alembic.command]
ignore_missing_imports = True

[mypy-alembic.config]
ignore_missing_imports = True

[mypy-beautifulsoup4.*]
ignore_missing_imports = True

[mypy-bleach.*]
ignore_missing_imports = True

[mypy-memory_profiler.*]
ignore_missing_imports = True

[mypy-aioresponses.*]
ignore_missing_imports = True

[mypy-aiofiles.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-opentelemetry.*]
ignore_missing_imports = True

[mypy-src.monitoring.tracing]
ignore_errors = True