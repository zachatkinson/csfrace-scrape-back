name: Semantic Release

on:
  workflow_run:
    workflows: ["Consolidated CI/CD & Submodule Sync"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false  # Don't cancel releases in progress
    # Only run if CI workflow completed successfully
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      id-token: write  # For provenance
      contents: write  # For creating releases
      issues: write    # For creating issues
      pull-requests: write  # For creating PRs
    
    steps:
      - name: Setup SSH key for semantic release
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SEMANTIC_RELEASE_SSH_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for semantic release
          ssh-key: ${{ secrets.SEMANTIC_RELEASE_SSH_KEY }}

      - name: Python Semantic Release
        id: semantic
        uses: python-semantic-release/python-semantic-release@v9.21.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          root_options: "-vv"  # Very verbose mode for detailed traceback

      - name: Update Umbrella Repository
        if: steps.semantic.outputs.released == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UMBRELLA_REPO_TOKEN }}
          repository: zachatkinson/csfrace-scrape
          event-type: backend-released
          client-payload: |
            {
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "version": "${{ steps.semantic.outputs.version }}",
              "tag": "${{ steps.semantic.outputs.tag }}",
              "actor": "${{ github.actor }}",
              "workflow": "${{ github.workflow }}",
              "timestamp": "${{ github.event.head_commit.timestamp }}",
              "release_url": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.semantic.outputs.tag }}",
              "changelog_url": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.semantic.outputs.tag }}"
            }

      - name: Log umbrella repository update
        if: steps.semantic.outputs.released == 'true'
        run: |
          echo "## 🚀 Umbrella Repository Update Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Version:** ${{ steps.semantic.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** ${{ steps.semantic.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.semantic.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The umbrella repository will be updated with the new backend release." >> $GITHUB_STEP_SUMMARY
          
          # Also log to console
          echo "🚀 Triggered umbrella repo update for backend release"
          echo "Repository: ${{ github.repository }}"
          echo "Version: ${{ steps.semantic.outputs.version }}"
          echo "Tag: ${{ steps.semantic.outputs.tag }}"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.semantic.outputs.tag }}"
          
      - name: Create release success summary
        if: success()
        run: |
          echo "## ✅ Semantic Release Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Release created successfully" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Release Details" >> $GITHUB_STEP_SUMMARY
          echo "Check the [Releases page](https://github.com/${{ github.repository }}/releases) for the new release." >> $GITHUB_STEP_SUMMARY