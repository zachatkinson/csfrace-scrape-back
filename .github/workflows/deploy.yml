name: 🚀 Production Deployment Pipeline

on:
  workflow_run:
    workflows: ["Semantic Release"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deployment (skip quality gates)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Ensure only one deployment runs at a time
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel deployments in progress

jobs:
  # Quality Gate - Must pass before any deployment
  quality-gate:
    name: 🔍 Pre-Deployment Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run if semantic release completed successfully (or manual trigger)
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    outputs:
      deploy-approved: ${{ steps.quality-check.outputs.approved }}
      security-status: ${{ steps.security-check.outputs.status }}
      coverage-status: ${{ steps.coverage-check.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-editable --extra dev

      - name: Run quality checks
        id: quality-check
        run: |
          echo "::group::Coverage Check"

          # Check if we have recent coverage data
          if [[ -f "coverage.xml" ]]; then
            coverage_percent=$(uv run coverage report --format=total 2>/dev/null || echo "0")
          else
            echo "::warning::No coverage data found, running quick coverage check"
            uv run pytest tests/unit/ --cov=src --cov-report=term-missing --tb=short -x
            coverage_percent=$(uv run coverage report --format=total 2>/dev/null || echo "0")
          fi

          echo "coverage_percent=${coverage_percent}" >> $GITHUB_OUTPUT

          if [[ "${coverage_percent}" -lt 85 ]]; then
            echo "::error::Coverage ${coverage_percent}% below 85% threshold"
            echo "approved=false" >> $GITHUB_OUTPUT
          else
            echo "::notice::Coverage ${coverage_percent}% meets threshold"
            echo "approved=true" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: Security vulnerability check
        id: security-check
        run: |
          echo "::group::Security Check"

          # Check for high/critical vulnerabilities
          uv run safety check --json --output safety-report.json --continue-on-error || true

          if [[ -f "safety-report.json" ]]; then
            high_vulns=$(cat safety-report.json | jq -r '.vulnerabilities[] | select(.vulnerability.severity=="high" or .vulnerability.severity=="critical") | .vulnerability.id' | wc -l || echo "0")

            if [[ "${high_vulns}" -gt 0 ]]; then
              echo "::error::${high_vulns} high/critical security vulnerabilities found"
              echo "status=failed" >> $GITHUB_OUTPUT
            else
              echo "::notice::No high/critical security vulnerabilities found"
              echo "status=passed" >> $GITHUB_OUTPUT
            fi
          else
            echo "::warning::Could not run security check"
            echo "status=warning" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: Final approval decision
        id: final-decision
        run: |
          force_deploy="${{ github.event.inputs.force_deploy }}"
          coverage_approved="${{ steps.quality-check.outputs.approved }}"
          security_status="${{ steps.security-check.outputs.status }}"

          if [[ "${force_deploy}" == "true" ]]; then
            echo "::warning::Force deploy enabled - bypassing quality gates"
            echo "approved=true" >> $GITHUB_OUTPUT
          elif [[ "${coverage_approved}" == "true" && "${security_status}" != "failed" ]]; then
            echo "::notice::All quality gates passed - deployment approved"
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "::error::Quality gates failed - deployment blocked"
            echo "approved=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  # Build and publish container image
  build-and-push:
    name: 🏗️ Build & Push Container Image
    runs-on: ubuntu-latest
    needs: quality-gate
    if: needs.quality-gate.outputs.deploy-approved == 'true'
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      image-digest: ${{ steps.image.outputs.digest }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build production stage
          target: production

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Set outputs
        id: image
        run: |
          echo "tag=${{ fromJSON(steps.meta.outputs.json).tags[0] }}" >> $GITHUB_OUTPUT
          echo "digest=${{ steps.push.outputs.digest }}" >> $GITHUB_OUTPUT

  # Deploy to Staging (automatic from master)
  deploy-staging:
    name: 🧪 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality-gate, build-and-push]
    if: |
      needs.quality-gate.outputs.deploy-approved == 'true' &&
      (github.event_name == 'push' || github.event.inputs.environment == 'staging')
    timeout-minutes: 10

    environment:
      name: staging
      url: https://staging.csfrace-scraper.example.com

    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment"
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-and-push.outputs.image-digest }}"

          # Here you would add your actual deployment commands
          # Examples:
          # - kubectl apply -f k8s/staging/
          # - docker-compose -f docker-compose.staging.yml up -d
          # - Deploy to cloud provider (AWS ECS, Google Cloud Run, etc.)

          echo "::notice::Staging deployment completed successfully"

      - name: Run smoke tests
        run: |
          echo "🔍 Running staging smoke tests"

          # Wait for service to be ready
          sleep 30

          # Example smoke tests
          # curl -f https://staging.csfrace-scraper.example.com/health || exit 1
          # python scripts/smoke-tests.py --env staging

          echo "::notice::Staging smoke tests passed"

  # Deploy to Production (manual approval required)
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-gate, build-and-push, deploy-staging]
    if: |
      always() &&
      needs.quality-gate.outputs.deploy-approved == 'true' &&
      needs.build-and-push.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') &&
      github.event.inputs.environment == 'production'
    timeout-minutes: 15

    environment:
      name: production
      url: https://csfrace-scraper.example.com

    steps:
      - name: Deploy to production
        run: |
          echo "🌟 Deploying to production environment"
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-and-push.outputs.image-digest }}"

          # Here you would add your actual production deployment commands
          # Examples:
          # - kubectl apply -f k8s/production/
          # - docker-compose -f docker-compose.prod.yml up -d
          # - Deploy to cloud provider with rolling update

          echo "::notice::Production deployment completed successfully"

      - name: Post-deployment verification
        run: |
          echo "🔍 Running production verification"

          # Wait for service to be ready
          sleep 60

          # Example health checks
          # curl -f https://csfrace-scraper.example.com/health || exit 1
          # python scripts/production-verification.py

          echo "::notice::Production verification passed"

      - name: Notify deployment success
        run: |
          echo "::notice title=🎉 Production Deployment::Successfully deployed ${{ needs.build-and-push.outputs.image-tag }} to production"

          # Add notifications here:
          # - Slack webhook
          # - Email notification
          # - Teams webhook
          # - Discord webhook

  # Post-deployment monitoring with auto-rollback
  post-deployment-monitoring:
    name: 📊 Post-Deployment Monitoring
    uses: ./.github/workflows/monitoring-gates.yml
    needs: [build-and-push, deploy-staging, deploy-production]
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    with:
      environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'staging' }}
      deployment_id: ${{ github.run_id }}
      image_tag: ${{ needs.build-and-push.outputs.image-tag }}
      rollback_enabled: true
    secrets:
      MONITORING_WEBHOOK: ${{ secrets.MONITORING_WEBHOOK }}
      ROLLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deployment status summary
  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [quality-gate, build-and-push, deploy-staging, deploy-production, post-deployment-monitoring]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 Deployment Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Quality Gate Status
          if [[ "${{ needs.quality-gate.result }}" == "success" ]]; then
            echo "✅ **Quality Gate**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Quality Gate**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Build Status
          if [[ "${{ needs.build-and-push.result }}" == "success" ]]; then
            echo "✅ **Container Build**: Completed" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Image**: \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Container Build**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Staging Deployment
          if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "🧪 **Staging**: Deployed successfully" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.deploy-staging.result }}" == "skipped" ]]; then
            echo "⏭️ **Staging**: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Staging**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Production Deployment
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "🌟 **Production**: Deployed successfully" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.deploy-production.result }}" == "skipped" ]]; then
            echo "⏭️ **Production**: Manual trigger required" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Production**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Generated on $(date -u)_" >> $GITHUB_STEP_SUMMARY