# ⚠️ DEPRECATED: This workflow has been moved to the orchestrator repository
#
# Deployment is now coordinated by the orchestrator at:
# https://github.com/zachatkinson/csfrace-scrape/.github/workflows/coordinated-deployment.yml
#
# Reason for deprecation:
# - Separation of Concerns: Individual repos publish artifacts, orchestrator deploys
# - Multi-service coordination: Deploy backend + frontend together atomically
# - Integration testing: Cross-service tests before deployment
# - Better monitoring: Orchestrator monitors all services together
#
# Migration path:
# 1. Individual repos (backend/frontend) publish versioned Docker images
# 2. Orchestrator pulls pre-built images and deploys them
# 3. Orchestrator runs integration tests before production
# 4. Orchestrator monitors health across all services
#
# To deploy:
# - Automatic: Push to master → Semantic release → Orchestrator auto-deploys to staging
# - Manual: GitHub Actions → csfrace-scrape → Coordinated Deployment → Run workflow
#
# Deprecated on: 2025-10-04
# Replaced by: zachatkinson/csfrace-scrape/.github/workflows/coordinated-deployment.yml

name: 🚫 DEPRECATED - Production Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      confirm-deprecated:
        description: 'This workflow is DEPRECATED. Use orchestrator deployment instead.'
        required: true
        type: boolean
        default: false

jobs:
  deprecation-notice:
    name: ⚠️ Deprecation Notice
    runs-on: ubuntu-latest
    steps:
      - name: Show deprecation notice
        run: |
          echo "::error title=Workflow Deprecated::This workflow has been deprecated and moved to the orchestrator repository"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚠️ This Workflow is Deprecated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment is now coordinated by the orchestrator repository." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### New Deployment Process" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Individual repos** (this repo): Publish versioned Docker images" >> $GITHUB_STEP_SUMMARY
          echo "2. **Orchestrator**: Pulls images and coordinates multi-service deployment" >> $GITHUB_STEP_SUMMARY
          echo "3. **Orchestrator**: Runs integration tests before production" >> $GITHUB_STEP_SUMMARY
          echo "4. **Orchestrator**: Monitors all services together" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Automatic (Staging):**" >> $GITHUB_STEP_SUMMARY
          echo "- Push to master → CI passes → Semantic release → Orchestrator auto-deploys" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Manual (Production):**" >> $GITHUB_STEP_SUMMARY
          echo "- Go to: https://github.com/zachatkinson/csfrace-scrape/actions" >> $GITHUB_STEP_SUMMARY
          echo "- Select: Coordinated Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Run workflow with specific backend and frontend versions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Benefits of New Architecture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Atomic multi-service deployments" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Integration tests before production" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cross-service health monitoring" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Automatic rollback on failures" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Clear separation of concerns" >> $GITHUB_STEP_SUMMARY
          exit 1
