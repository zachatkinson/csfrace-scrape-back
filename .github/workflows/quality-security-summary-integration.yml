# The action provides these outputs that can be used in workflow decision making:
# - summary-generated: boolean indicating if summary was created
# - total-issues: total number of issues across all scans  
# - security-status: overall security status (secure|issues|critical)
# - quality-status: overall quality status (passed|failed)
# - critical-count: number of critical severity issues
# - high-count: number of high severity issues