# Integration example for adding the Code Quality & Security Summary to existing CI workflow
# Add this step to the "quality" job in .github/workflows/ci.yml

# Add this step at the end of the quality job (after step "Calculate job duration and set outputs")

      - name: Generate Code Quality & Security Summary
        if: always()  # Run even if previous steps failed
        uses: ./.github/actions  # Use our local action
        with:
          quality-duration: ${{ steps.quality-check.outputs.duration }}
          include-coverage: 'true'
          severity-threshold: 'medium'
          custom-title: '🛡️ Code Quality & Security Report'

